[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "ml4ff"
version = "0.1.0"
authors = [
    {name = "ML4FF Team", email = "info@ml4ff.com"},
]
description = "Machine Learning for Fantasy Football - Comprehensive toolkit for NFL fantasy analysis and predictions"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Games/Entertainment",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
keywords = ["fantasy football", "nfl", "machine learning", "sports analytics", "predictions"]
dependencies = [
    "numpy>=1.21.0",
    "pandas>=1.3.0",
    "scikit-learn>=1.0.0",
    "matplotlib>=3.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=6.0.0",
    "jupyter>=1.0.0",
    "black",
    "flake8",
    "mypy",
]

[project.urls]
Homepage = "https://github.com/mtdiedrich/ML4FF"
Documentation = "https://github.com/mtdiedrich/ML4FF"
Repository = "https://github.com/mtdiedrich/ML4FF"
"Bug Tracker" = "https://github.com/mtdiedrich/ML4FF/issues"

[project.scripts]
ml4ff-data = "ml4ff.cli:data_acquisition_cli"
ml4ff-rookie = "ml4ff.cli:rookie_projection_cli"
ml4ff-breakout = "ml4ff.cli:player_breakout_cli"
ml4ff-dropoff = "ml4ff.cli:player_dropoff_cli"

[tool.setuptools]
packages = ["ml4ff", "ml4ff.pipelines"]

[tool.setuptools.package-data]
"ml4ff" = ["*.csv", "*.json"]

[tool.black]
line-length = 88
target-version = ['py38']

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]